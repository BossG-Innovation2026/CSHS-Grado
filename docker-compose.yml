# Optional: a real Postgres 17 for local development (alternative to `npm run db:dev`).
# Usage: docker compose up -d   then   npm run db:migrate
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - grado-pg:/var/lib/postgresql/data
volumes:
  grado-pg:
