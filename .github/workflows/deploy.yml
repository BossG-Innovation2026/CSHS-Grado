name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys (or two migrations) at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to deploy until Postgres is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if grep -q "REPLACE_WITH_HYPERDRIVE_ID" wrangler.toml; then
            echo "::error::wrangler.toml still has the Hyperdrive placeholder. See docs/architecture.md (Go-live steps)."
            exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The DATABASE_URL secret (Neon direct connection string) is not set."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

      - name: Build Worker
        run: npx opennextjs-cloudflare build

      # Migrations run before the new code goes live. Keep them backwards
      # compatible (add columns/tables first, drop old ones in a later release).
      - name: Apply database migrations (Neon)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          command: deploy
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            BETTER_AUTH_SECRET
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      # ---- Demo site (grado-demo): same build, fake-data database ----------
      - name: Is the demo site configured?
        id: demo
        env:
          DATABASE_URL_DEMO: ${{ secrets.DATABASE_URL_DEMO }}
        run: |
          if [ -n "$DATABASE_URL_DEMO" ] && ! grep -q "REPLACE_WITH_DEMO_HYPERDRIVE_ID" wrangler.toml; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Demo site not configured (run scripts/go-live-demo.mjs); skipping."
          fi

      - name: Apply database migrations (demo)
        if: steps.demo.outputs.enabled == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEMO }}
        run: npm run db:migrate

      - name: Deploy demo Worker
        if: steps.demo.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          command: deploy --env demo
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Demo auth secret (set once)
        if: steps.demo.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET_DEMO: ${{ secrets.BETTER_AUTH_SECRET_DEMO }}
        run: |
          if npx wrangler secret list --env demo | grep -q BETTER_AUTH_SECRET; then
            echo "Demo auth secret already set."
          else
            node -e 'process.stdout.write(JSON.stringify({ BETTER_AUTH_SECRET: process.env.BETTER_AUTH_SECRET_DEMO }))' \
              | npx wrangler secret bulk --env demo
          fi
