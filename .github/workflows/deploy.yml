name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys (or two migrations) at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to deploy until Postgres is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if grep -q "REPLACE_WITH_HYPERDRIVE_ID" wrangler.toml; then
            echo "::error::wrangler.toml still has the Hyperdrive placeholder. See docs/architecture.md (Go-live steps)."
            exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The DATABASE_URL secret (Neon direct connection string) is not set."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

      - name: Build Worker
        run: npx opennextjs-cloudflare build

      # Migrations run before the new code goes live. Keep them backwards
      # compatible (add columns/tables first, drop old ones in a later release).
      - name: Apply database migrations (Neon)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          command: deploy
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            BETTER_AUTH_SECRET
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
